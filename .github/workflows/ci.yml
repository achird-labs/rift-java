name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: verify (JDK ${{ matrix.jdk }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: ['17', '21', '22']
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Build and verify
        run: ./mvnw -B -ntp verify

      # Guard the JDK-gating profiles: a module wrongly *included* on the wrong JDK fails to
      # compile, but a module wrongly *excluded* (a typo in a <jdk> range) would leave the reactor
      # smaller while verify still exits 0. Assert the built module set matches the JDK.
      - name: Assert JDK-gated module set
        shell: bash
        run: |
          built() { test -n "$(find "$1/target" -maxdepth 1 -name '*.jar' 2>/dev/null)"; }
          case "${{ matrix.jdk }}" in
            17)
              built rift-java-embedded && { echo "rift-java-embedded must NOT build on JDK 17"; exit 1; }
              built rift-java-embedded-jdk21 && { echo "rift-java-embedded-jdk21 must NOT build on JDK 17"; exit 1; }
              ;;
            21)
              built rift-java-embedded-jdk21 || { echo "rift-java-embedded-jdk21 must build on JDK 21"; exit 1; }
              built rift-java-embedded && { echo "rift-java-embedded must NOT build on JDK 21"; exit 1; }
              ;;
            22)
              built rift-java-embedded || { echo "rift-java-embedded must build on JDK 22"; exit 1; }
              built rift-java-embedded-jdk21 && { echo "rift-java-embedded-jdk21 must NOT build on JDK 22"; exit 1; }
              ;;
          esac
          echo "JDK ${{ matrix.jdk }} built the expected module set."

  # Continuously exercise the release assembly (sources + javadoc + central-publishing plugin load)
  # so a regression in the publish path is caught on every push/PR, not at the next real deploy.
  # GPG signing and the actual deploy need secrets and run only in publish.yml.
  release-smoke:
    name: release assembly (dry, JDK 21 + JDK 22 toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Mirrors publish.yml's JDK setup: the reactor runs on JDK 21 and JDK 22 is installed
      # alongside as a toolchain, so -DdualEmbedded below can build the stable-FFM
      # rift-java-embedded in the same reactor. setup-java lists 22 first so JAVA_HOME ends up
      # on 21, and exports JAVA_HOME_22_X64 for the toolchains.xml step.
      - name: Set up JDK 21 (reactor) and JDK 22 (toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            22
            21
          cache: maven
      - name: Register the JDK 22 toolchain
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>22</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_22_X64}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          XML
      - name: Verify with the release profile (no signing, no deploy)
        # Include natives-bundle so a broken natives assembly (fetch, sha256, classifier jar wiring,
        # or a manifest/platform drift) is caught on every push/PR, not at the next real deploy.
        # -DdualEmbedded matches what publish.yml actually deploys, so every module that ships to
        # Central has its javadoc built here. Without it rift-java-embedded is absent from this
        # reactor and a javadoc error in it would surface only mid-deploy, after the tag is pushed.
        # The goal must be `verify`, not `package`: rift-java-bom's resolve-through-bom invoker IT
        # binds to pre-integration-test/integration-test, which are *after* package, so at package
        # the IT is silently never reached even though -Prelease sets invoker.skip=false (#199).
        # Two consequences of reaching `verify`: -Dgpg.skip=true is now load-bearing (gpg:sign also
        # binds to verify, and the runner has no key), and invoker.streamLogs surfaces the forked
        # consumer build's output in this job's log — without it a failed IT reports little beyond
        # "The following builds failed: resolve-through-bom".
        run: ./mvnw -B -ntp -Prelease,natives-bundle -DdualEmbedded -DskipTests -Dgpg.skip=true -Dinvoker.streamLogs=true verify

      # The step above proves only that the CURRENT doc comments are clean, which cannot distinguish
      # "strict and clean" from "permissive and clean" — so a re-added failOnError=false would make
      # every future run pass silently (#200). Poison one doc comment and require the release-lane
      # javadoc build to fail: that is the negative test which verified #197/ca2c031, made permanent.
      # Behavioural on purpose — it catches any mechanism that silences javadoc errors for
      # rift-java-core (failOnError=false, doclint=none, -Xdoclint:none in additionalJOptions,
      # maven.javadoc.skip), rather than grepping for one literal flag. The config it pins lives in
      # the root pluginManagement, which is the realistic regression vector; a per-module override
      # elsewhere would not be caught here.
      - name: Javadoc strictness canary (negative test)
        run: |
          set -euo pipefail
          F=rift-java-core/src/main/java/io/github/achirdlabs/rift/Rift.java
          LOG=$(mktemp)
          # Restore on EVERY exit path (including a cancelled job) so the deliberately-broken doc
          # comment can never leak into a later step, and so an error branch prints its diagnostic
          # instead of being pre-empted by a failing cleanup command under `set -e`.
          trap 'git checkout -- "$F"; rm -f "$LOG"' EXIT

          sed -i.bak 's|admin API\.|admin API. {@link does.not.Exist}|' "$F" && rm -f "$F.bak"
          # Anchor drift (someone rewords Rift.java's first javadoc sentence) must fail loud here,
          # otherwise the un-poisoned build below would succeed and be reported as a regression.
          if git diff --quiet -- "$F"; then
            echo "::error::javadoc canary: sed anchor matched nothing in $F — update the anchor"
            exit 1
          fi

          if ./mvnw -B -ntp -Prelease -DskipTests -Dgpg.skip=true -pl rift-java-core -am package > "$LOG" 2>&1; then
            echo "::error::javadoc strictness regressed: a broken {@link} no longer fails the release build (#197). If the anchor sentence moved out of Rift.java's javadoc comment, fix the anchor instead."
            tail -40 "$LOG"
            exit 1
          fi

          # A build that failed for some OTHER reason (compile break, network, OOM) would satisfy the
          # check above vacuously, so require the doclint diagnostic against the file we poisoned.
          if ! grep -q 'Rift\.java:[0-9]\+: error: reference not found' "$LOG"; then
            echo "::error::javadoc canary build failed, but not with the expected doclint error — strictness is unproven"
            tail -40 "$LOG"
            exit 1
          fi

          echo "javadoc strictness confirmed: the poisoned build failed with 'error: reference not found'"

      # The canary above only poisons rift-java-core, so it pins the ROOT pluginManagement. A
      # per-module <failOnError>false</failOnError> in some other module leaves it — and the main
      # release build — green while that module ships broken javadoc to Central (#203). This sweeps
      # the effective pom of EVERY module in the release reactor for the known silencers. Same flags
      # as the main step, so the reactor inspected is the one that actually publishes.
      - name: Javadoc strictness across all modules (effective-pom sweep)
        run: |
          set -euo pipefail
          EFF=$(mktemp)
          trap 'rm -f "$EFF"' EXIT
          # Prove the detector still detects before trusting a clean sweep: a checker edit that
          # stopped flagging anything would otherwise report "confirmed" forever.
          python3 scripts/check-javadoc-strictness.py --self-test
          ./mvnw -B -ntp -Prelease,natives-bundle -DdualEmbedded help:effective-pom -Doutput="$EFF"
          # --require names the modules this JDK-21 + -DdualEmbedded reactor must contain, so a
          # module silently dropping out of the reactor fails the sweep instead of shrinking it.
          python3 scripts/check-javadoc-strictness.py "$EFF" --require \
            rift-java-parent,rift-java-core,rift-java-jackson,rift-java-junit5,rift-java-natives,rift-java-spring,rift-java-testcontainers,rift-java-conformance,rift-java-bom,rift-java-embedded,rift-java-embedded-jdk21

  # The Docker-enabled lane for rift-java-testcontainers: RIFT_IT=1 un-gates the RiftContainer
  # round-trip ITs (they self-skip everywhere else). ubuntu-latest runners ship a Docker daemon.
  testcontainers-it:
    name: testcontainers ITs (Docker, JDK 17)
    runs-on: ubuntu-latest
    env:
      RIFT_IT: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run RiftContainer integration tests against Docker
        run: ./mvnw -B -ntp -pl rift-java-testcontainers -am test

  # The conformance gate: replays the engine's published SDK conformance corpus over each supported
  # transport (parse fidelity + DSL expressibility + engine _verify replay). The corpus is version-
  # locked to the pinned engine (rift.engine.version). RIFT_IT=1 un-gates the replay; CONFORMANCE_
  # TRANSPORT selects it (SPAWN downloads the engine binary; EMBEDDED runs it in-process over FFM and
  # so each embedded lane fetches its platform's librift_ffi and exposes it via RIFT_FFI_LIB).
  # Windows stays experimental (continue-on-error) until it is green for two consecutive weeks.
  conformance:
    name: conformance (${{ matrix.lane.transport }} / ${{ matrix.lane.os }} JDK ${{ matrix.lane.jdk }})
    runs-on: ${{ matrix.lane.os }}
    continue-on-error: ${{ matrix.lane.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        lane:
          - { os: ubuntu-latest, jdk: '17', transport: SPAWN }                          # M1 gate
          - { os: ubuntu-latest, jdk: '22', transport: EMBEDDED }                       # M2 gate
          - { os: ubuntu-latest, jdk: '21', transport: EMBEDDED }                       # M2 gate (preview FFM)
          - { os: macos-14, jdk: '22', transport: EMBEDDED }                            # M2 gate (darwin-aarch64)
          - { os: windows-latest, jdk: '22', transport: EMBEDDED, experimental: true }  # experimental
    env:
      RIFT_IT: '1'
      CONFORMANCE_TRANSPORT: ${{ matrix.lane.transport }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK ${{ matrix.lane.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.lane.jdk }}
          cache: maven
      - name: Download the version-locked conformance corpus
        shell: bash
        run: |
          set -euo pipefail
          VER="$(./mvnw -q -N help:evaluate -Dexpression=rift.engine.version -DforceStdout)"
          echo "Pinned engine/corpus version: v${VER}"
          mkdir -p rift-java-conformance/target/corpus
          # Download + extract via workspace-relative paths (under the gitignored target/). A
          # ${RUNNER_TEMP} path on Windows starts with a drive letter (D:\...), which GNU tar in Git
          # bash parses as a host:path remote spec ("Cannot connect to D") and fails the whole lane.
          curl -fsSL -o rift-java-conformance/target/sdk-conformance.tar.gz \
            "https://github.com/achird-labs/rift/releases/download/v${VER}/sdk-conformance-v${VER}.tar.gz"
          tar -xzf rift-java-conformance/target/sdk-conformance.tar.gz -C rift-java-conformance/target/corpus
          # Point at the parent dir; Corpus.descend() resolves the single extracted sdk-conformance-* child,
          # so this survives a change to the tarball's top-level directory name.
          echo "RIFT_CORPUS_ROOT=$(pwd)/rift-java-conformance/target/corpus" >> "$GITHUB_ENV"
      - name: Fetch the platform librift_ffi (embedded lanes)
        if: matrix.lane.transport == 'EMBEDDED'
        shell: bash
        run: |
          set -euo pipefail
          VER="$(./mvnw -q -N help:evaluate -Dexpression=rift.engine.version -DforceStdout)"
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   ASSET="librift_ffi-linux-x86_64.so" ;;
            macOS-ARM64) ASSET="librift_ffi-darwin-aarch64.dylib" ;;
            macOS-X64)   ASSET="librift_ffi-darwin-x86_64.dylib" ;;
            Windows-X64) ASSET="librift_ffi-windows-x86_64.dll" ;;
            *) echo "no librift_ffi asset for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          curl -fsSL -o "${RUNNER_TEMP}/${ASSET}" \
            "https://github.com/achird-labs/rift/releases/download/v${VER}/${ASSET}"
          echo "RIFT_FFI_LIB=${RUNNER_TEMP}/${ASSET}" >> "$GITHUB_ENV"
      - name: Replay the corpus over the ${{ matrix.lane.transport }} transport
        shell: bash
        run: ./mvnw -B -ntp -pl rift-java-conformance -am verify
